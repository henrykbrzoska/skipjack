[workspace]
resolver = "2"
members = ["crates/skipjack-core", "crates/skipjack-cli", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Skipjack contributors"]

[workspace.dependencies]
skipjack-core = { path = "crates/skipjack-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "charset", "http2", "macos-system-configuration"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
